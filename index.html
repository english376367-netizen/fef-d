function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(text){if(!('speechSynthesis'in window)){alert('Audio is not supported in this browser. Please use an updated Chrome or Edge.');return}try{let s=window.speechSynthesis;s.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.82;u.volume=1;let vs=s.getVoices();u.voice=vs.find(v=>/^en-GB$/i.test(v.lang))||vs.find(v=>/^en(-|_)/i.test(v.lang))||null;s.speak(u);if(s.paused)s.resume()}catch(e){console.error(e)}}
function switchMode(m){mode=m;document.getElementById('exercise1').classList.toggle('hidden',m!==1);document.getElementById('exercise2').classList.toggle('hidden',m!==2);document.getElementById('tab1').className='tab'+(m===1?' active':' secondary');document.getElementById('tab2').className='tab'+(m===2?' active':' secondary')}
function restartChoice(){order1=shuffle([...Array(VOCAB.length).keys()]);qIndex=0;e1Score=0;renderChoice()}
function renderChoice(){selected=null;checked=false;let q=VOCAB[order1[qIndex]];let distractors=shuffle(VOCAB.map((_,i)=>i).filter(i=>i!==order1[qIndex])).slice(0,2);let options=shuffle([order1[qIndex],...distractors]);document.getElementById('e1progress').textContent=`Question ${qIndex+1} of ${VOCAB.length}`;document.getElementById('e1score').textContent=`Score: ${e1Score}`;document.getElementById('e1bar').style.width=(qIndex/VOCAB.length*100)+'%';document.getElementById('e1prompt').textContent='Choose the picture for the word: '+q.word;document.getElementById('choices').innerHTML=options.map(i=>`<button class="picchoice" data-index="${i}" onclick="selectChoice(${i},this)" aria-label="Listen to picture"><img src="${VOCAB[i].img}" alt="Picture choice" draggable="false"><span>🔊 Listen</span></button>`).join('');document.getElementById('e1feedback').className='feedback';document.getElementById('e1feedback').textContent='';document.getElementById('e1check').disabled=false;document.getElementById('e1next').disabled=true;document.getElementById('e1bar').style.width=(qIndex/VOCAB.length*100)+'%';if(qIndex>=VOCAB.length){showDone(1);}}
function selectChoice(i,el){speak(VOCAB[i].word);if(checked)return;selected=i;document.querySelectorAll('.picchoice').forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}
function checkChoice(){if(checked)return;if(selected===null){document.getElementById('e1feedback').className='feedback show bad';document.getElementById('e1feedback').textContent='Choose a picture first.';return}checked=true;let target=order1[qIndex],ok=selected===target;let fb=document.getElementById('e1feedback');fb.className='feedback show '+(ok?'good':'bad');fb.textContent=ok?'Correct! Well done.':'Not quite. The correct picture is the one for “'+VOCAB[target].word+'”.';if(ok)e1Score++;document.querySelectorAll('.picchoice').forEach(b=>{let i=+b.dataset.index;if(i===target)b.classList.add('correct');else if(i===selected)b.classList.add('incorrect')});document.getElementById('e1score').textContent=`Score: ${e1Score}`;document.getElementById('e1check').disabled=true;document.getElementById('e1next').disabled=false}
function nextChoice(){if(!checked)return;qIndex++;if(qIndex>=VOCAB.length){showDone(1);return}renderChoice()}
function restartTyped(){order2=shuffle([...Array(VOCAB.length).keys()]);e2Index=0;e2Score=0;document.getElementById('e2img').classList.remove('hidden');document.getElementById('typed').classList.remove('hidden');document.getElementById('typed').disabled=false;let btn=document.querySelector('#exercise2 .answerrow button');btn.classList.remove('hidden');btn.textContent='Check';btn.onclick=submitTyped;renderTyped()}
function renderTyped(){e2Checked=false;let item=VOCAB[order2[e2Index]];document.getElementById('e2progress').textContent=`Question ${e2Index+1} of ${VOCAB.length}`;document.getElementById('e2score').textContent=`Score: ${e2Score}`;document.getElementById('e2bar').style.width=(e2Index/VOCAB.length*100)+'%';document.getElementById('e2img').src=item.img;document.getElementById('e2img').alt='Vocabulary picture';document.getElementById('e2hint').textContent=item.vi;document.getElementById('e2ipa').textContent='';document.getElementById('typed').value='';document.getElementById('typed').disabled=false;document.getElementById('e2feedback').className='feedback';document.getElementById('e2feedback').textContent='';document.getElementById('typed').focus();if(e2Index>=VOCAB.length)showDone(2)}
function playCurrentWord(){if(e2Index<VOCAB.length)speak(VOCAB[order2[e2Index]].word)}
function submitTyped(){if(e2Checked||e2Index>=VOCAB.length)return;let item=VOCAB[order2[e2Index]],value=document.getElementById('typed').value.trim();if(!value){document.getElementById('e2feedback').className='feedback show bad';document.getElementById('e2feedback').textContent='Type an answer or choose Skip.';return}e2Checked=true;let norm=s=>s.toLocaleLowerCase().trim().replace(/\s+/g,' ');let ok=norm(value)===norm(item.word);let fb=document.getElementById('e2feedback');fb.className='feedback show '+(ok?'good':'bad');fb.textContent=ok?'Correct! Well done.':'Not quite. Correct answer: '+item.word+'.';if(ok)e2Score++;document.getElementById('e2score').textContent=`Score: ${e2Score}`;document.getElementById('typed').disabled=true;let btn=document.querySelector('#exercise2 .answerrow button');btn.textContent='Next';btn.onclick=advanceTyped}
function advanceTyped(){e2Index++;if(e2Index>=VOCAB.length){showDone(2);return}let btn=document.querySelector('#exercise2 .answerrow button');btn.textContent='Check';btn.onclick=submitTyped;renderTyped()}
function skipTyped(){if(e2Index>=VOCAB.length)return;e2Index++;if(e2Index>=VOCAB.length){showDone(2);return}let btn=document.querySelector('#exercise2 .answerrow button');btn.textContent='Check';btn.onclick=submitTyped;renderTyped()}
document.getElementById('typed').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(e2Checked)advanceTyped();else submitTyped()}});
function showDone(which){if(which===1){document.getElementById('choices').innerHTML=`<div class="done" style="grid-column:1/-1"><h3>Exercise complete!</h3><p>Your score: ${e1Score}/${VOCAB.length}</p><button onclick="restartChoice()">Play again</button></div>`;document.getElementById('e1prompt').textContent='Great work!';document.getElementById('e1check').disabled=true;document.getElementById('e1next').disabled=true;document.getElementById('e1bar').style.width='100%'}else{document.getElementById('e2img').classList.add('hidden');document.getElementById('e2hint').textContent='Exercise complete!';document.getElementById('e2ipa').textContent=`Your score: ${e2Score}/${VOCAB.length}`;document.getElementById('typed').classList.add('hidden');document.querySelector('#exercise2 .answerrow button').classList.add('hidden');document.getElementById('e2bar').style.width='100%';document.getElementById('e2feedback').className='feedback show good';document.getElementById('e2feedback').textContent='Well done! You have finished all the words.'}}
restartChoice();restartTyped();
</script></body></html>
